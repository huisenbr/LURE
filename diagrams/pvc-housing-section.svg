<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 475" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest">
<title>PVC housing cross-section</title>
<desc>Side cut through a 3 inch Schedule 40 PVC housing. Left end is a cemented cap. The hold magnet is mounted on the outside face of the cap and holds a thick steel washer that is tied to the float. Its two wires pass through one drilled hole in the cap that is sealed with epoxy. The piezo disc is glued flat to the inside face of the cap. Electronics, the 2 x 4 AA holders and a battery switch sit inside. Right end is a threaded clean-out with an O-ring for arming and battery changes.</desc>
<rect width="780" height="475" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="600" fill="#222">LURE PVC housing cross-section (plan for now, not final)</text>
<text x="20" y="44" font-size="11" fill="#555">3 inch Schedule 40 first, 4 inch if the parts do not fit. Not trusted until the dry run and the wire hole leak test pass.</text>

<!-- float, washer and magnet (outside the housing) -->
<ellipse cx="40" cy="215" rx="32" ry="40" fill="#f0997b" stroke="#993c1d"/>
<text x="26" y="219" font-size="11" fill="#4a1b0c">float</text>
<line x1="72" y1="215" x2="82" y2="215" stroke="#993c1d" stroke-width="2"/>
<rect x="82" y="178" width="12" height="74" fill="#5f5e5a"/>
<text x="20" y="274" font-size="10" fill="#444">steel washer</text>
<text x="20" y="286" font-size="10" fill="#444">(on the float)</text>
<rect x="96" y="178" width="34" height="74" fill="#f5c4b3" stroke="#993c1d"/>
<text x="8" y="140" font-size="10" fill="#4a1b0c">hold magnet</text>
<text x="8" y="152" font-size="10" fill="#4a1b0c">(outside the cap)</text>
<line x1="62" y1="158" x2="108" y2="178" stroke="#993c1d" stroke-width="1"/>
<!-- cap -->
<rect x="130" y="120" width="60" height="190" rx="4" fill="#afa9ec" stroke="#534ab7"/>
<text x="118" y="108" font-size="11" fill="#26215c">cemented end cap</text>
<!-- pipe -->
<rect x="190" y="130" width="440" height="14" fill="#cecbf6" stroke="#534ab7"/>
<rect x="190" y="286" width="440" height="14" fill="#cecbf6" stroke="#534ab7"/>
<!-- piezo inside, wires through the cap -->
<rect x="192" y="150" width="8" height="24" fill="#faeeda" stroke="#ba7517"/>
<text x="204" y="164" font-size="10" fill="#412402">piezo (glued flat)</text>
<line x1="130" y1="205" x2="250" y2="205" stroke="#d85a30" stroke-width="2"/>
<line x1="130" y1="217" x2="250" y2="217" stroke="#d85a30" stroke-width="2"/>
<rect x="150" y="196" width="20" height="30" rx="3" fill="#d85a30" stroke="#712b13"/>
<text x="140" y="242" font-size="10" fill="#26215c">epoxied</text>
<text x="140" y="254" font-size="10" fill="#26215c">wire hole</text>
<!-- electronics -->
<rect x="250" y="168" width="110" height="86" rx="4" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="258" y="186" font-size="11" fill="#04342c">Pro Mini</text>
<text x="258" y="210" font-size="11" fill="#04342c">DS3231</text>
<text x="258" y="226" font-size="11" fill="#04342c">MOSFET + diode</text>
<text x="258" y="242" font-size="11" fill="#04342c">piezo bias</text>
<rect x="380" y="162" width="180" height="98" rx="4" fill="#faeeda" stroke="#ba7517"/>
<text x="404" y="206" font-size="12" fill="#412402">2 x 4 AA holders</text>
<text x="404" y="224" font-size="11" fill="#412402">(lithium cells)</text>
<rect x="566" y="190" width="56" height="42" rx="4" fill="#f1efe8" stroke="#5f5e5a"/>
<text x="572" y="208" font-size="10" fill="#2c2c2a">battery</text>
<text x="572" y="221" font-size="10" fill="#2c2c2a">switch</text>
<!-- clean-out adapter -->
<rect x="630" y="124" width="60" height="182" rx="4" fill="#afa9ec" stroke="#534ab7"/>
<rect x="690" y="150" width="34" height="130" rx="4" fill="#cecbf6" stroke="#534ab7"/>
<circle cx="707" cy="160" r="5" fill="#2c2c2a"/>
<circle cx="707" cy="270" r="5" fill="#2c2c2a"/>
<text x="640" y="108" font-size="11" fill="#26215c">threaded clean-out + plug</text>
<text x="640" y="322" font-size="10" fill="#26215c">O-ring (not an expanding</text>
<text x="640" y="334" font-size="10" fill="#26215c">gripper plug)</text>
<!-- callouts -->
<text x="20" y="372" font-size="11" fill="#333">1. The magnet is outside the cap, so no pull has to cross the wall. The piezo signal crosses one wall (the end cap).</text>
<text x="20" y="390" font-size="11" fill="#333">2. The two magnet wires pass through one drilled hole in the cap, sealed with epoxy. Leak test it on a scrap cap first.</text>
<text x="20" y="408" font-size="11" fill="#333">3. Any gap between the washer and the magnet cuts holding force fast. Keep both clean and flat against each other.</text>
<text x="20" y="426" font-size="11" fill="#333">4. Sealed pipe full of air floats: tie it to the blocks with rope or strap, not zip ties.</text>
<text x="20" y="450" font-size="11" fill="#333">Backup if PVC fails the dry run (40 ft, 1 week, towels inside, wire hole included): OtterBox-style dry box, same tests.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
