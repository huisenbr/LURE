<p class="file">diagrams/system-layout.svg</p></section><section class="panel" id="electronics-wiring"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest">
<title>Electronics wiring: timer, hold magnet and piezo tone trigger</title>
<desc>One 12 V pack of two 4 AA holders in series feeds, through a fuse and a battery on/off switch, the Arduino Nano on VIN and the hold magnet. The switch is how the unit is armed. A DS3231 clock on I2C wakes the Nano through its alarm pin on D2. D9 drives the IRLZ44N gate through 220 ohms with a 10k pulldown, and the MOSFET switches the magnet to ground with a flyback diode across it. A bias divider from 5V has its midpoint on A0 and through a 0.1 uF capacitor to a 35 mm piezo disc. All grounds join one bus. The hold magnet and its steel washer are outside the sealed housing; the two magnet wires pass through one drilled hole in the cap that is sealed with epoxy. The strip along the bottom shows deep sleep until the wake time, then non-stop listening, then a 3 s fire pulse with a 5 s wait, then back to listening.</desc>

<text x="720" y="220" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">on the float</text>
<text x="20" y="640" font-size="11" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Nano in sleep still draws about 15 to 20 mA, so this build is for the bench and days of running.</text>
<text x="20" y="656" font-size="11" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Sealed build: 3.3 V Pro Mini on RAW (rated 3.4 to 12 V). Pull its LED and measure sleep current.</text>
<text x="20" y="672" font-size="11" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Magnet: APW EML32mm-12, 12 V, 1.2 A, 10 ohm. Holds with no power and lets go when powered.</text>
<text x="20" y="688" font-size="11" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Coil polarity and the shortest working pulse are not on the listing. Measure them on the bench.</text>
<text x="20" y="704" font-size="11" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Flow strip matches Main.ino: on switch-on it checks the DS3231 date, sleeps until the wake date set at upload, then listens non-stop.</text>
<text x="20" y="720" font-size="11" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Arming: program over USB, unplug it, then flip the battery switch on. The switch is in the +12 V line ahead of everything.</text>
<text x="20" y="736" font-size="11" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">The magnet and washer are outside the housing. The two magnet wires pass through one drilled hole in the cap, sealed with epoxy.</text>
<text x="20" y="752" font-size="11" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">*The divider top goes to the same 5V pin as the clock. Powering it from D7 to save sleep current is planned, not in the sketch yet.</text>
</g>

<title>PVC housing cross-section</title>
<desc>Side cut through a 3 inch Schedule 40 PVC housing. Left end is a cemented cap. The hold magnet is mounted on the outside face of the cap and holds a thick steel washer that is tied to the float. Its two wires pass through one drilled hole in the cap that is sealed with epoxy. The piezo disc is glued flat to the inside face of the cap. Electronics, the 2 x 4 AA holders and a battery switch sit inside. Right end is a threaded clean-out with an O-ring for arming and battery changes.</desc>

<text x="20" y="44" font-size="11" fill="#555">3 inch Schedule 40 first, 4 inch if the parts do not fit. Not trusted until the dry run and the wire hole leak test pass.</text>

<!-- callouts -->
<text x="20" y="372" font-size="11" fill="#333">1. The magnet is outside the cap, so no pull has to cross the wall. The piezo signal crosses one wall (the end cap).</text>
<text x="20" y="390" font-size="11" fill="#333">2. The two magnet wires pass through one drilled hole in the cap, sealed with epoxy. Leak test it on a scrap cap first.</text>
<text x="20" y="408" font-size="11" fill="#333">3. Any gap between the washer and the magnet cuts holding force fast. Keep both clean and flat against each other.</text>
<text x="20" y="426" font-size="11" fill="#333">4. Sealed pipe full of air floats: tie it to the blocks with rope or strap, not zip ties.</text>
